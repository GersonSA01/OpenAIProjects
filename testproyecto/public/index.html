<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Chat Contextual con OpenAI</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .chat-layout { display: flex; gap: 20px; }
    #context-box, #chat-box {
      border: 1px solid #ddd; 
      padding: 15px; 
      border-radius: 8px; 
      flex: 1;
    }
    #messages { 
      border: 1px solid #ddd; 
      padding: 10px; 
      height: 300px; 
      overflow-y: auto; 
      margin-bottom: 10px; 
      background: #fafafa;
    }
    .user { color: blue; margin-bottom: 5px; }
    .bot { color: green; margin-bottom: 10px; }
    .info { color: gray; font-style: italic; margin-bottom: 10px; }
  </style>
</head>
<body>
  <!-- Paso 1: Dar contexto -->
  <div id="context-container">
    <h2 class="titulo-chat">Configurar Contexto</h2>
    <textarea id="context" placeholder="Agrega contexto para la conversación..."></textarea><br>
    <input type="password" id="apikey" placeholder="Tu API Key" size="50"><br><br>
    <button onclick="confirmarContexto()">✅ Confirmar Contexto</button>
  </div>

  <!-- Paso 2: Chat solo con voz -->
  <div id="chat-container" style="display: none;">
    <div class="chat-layout">
      <div id="context-box">
        <h3>📋 Contexto actual</h3>
        <p id="context-view"></p>
      </div>
      <div id="chat-box">
        <h3>🎤 Habla con la IA</h3>
        <div id="messages"></div>
        <!-- 👉 id="record-btn" para que el script pueda modificar el texto -->
        <button id="record-btn" onclick="grabarMensaje()">🎤 Hablar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
